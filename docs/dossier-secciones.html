<!--
  FUENTE DE LOS DOSSIERS POR SECCIÓN (public/dossier-{seccion}.pdf)
  Una sola plantilla parametrizada: ?seccion=shopify|webs|imagenes|branding

  Para regenerar los 4 PDF tras editar tarifas o textos (desde la raíz):

  for s in shopify webs imagenes branding; do
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --no-pdf-header-footer --virtual-time-budget=8000 \
      --print-to-pdf="public/dossier-$s.pdf" "file://$PWD/docs/dossier-secciones.html?seccion=$s"
  done
-->
